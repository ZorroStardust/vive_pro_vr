[project]
name = "mujoco-vive-scripts"
version = "0.2.0"
description = "Minimal Python scripts for MuJoCo stereo rendering with VIVE/Monado/OpenXR."
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1.0",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
openxr = [
  "pyopenxr>=1.0.0",
  "PyOpenGL>=3.1.7",
  "glfw>=2.7.0",
]

[project.scripts]
mvs-list-monitors = "mujoco_vive_scripts.list_monitors:main"
mvs-save-stereo-frames = "mujoco_vive_scripts.save_stereo_frames:main"
mvs-mujoco-sbs = "mujoco_vive_scripts.mujoco_sbs_glfw:main"
mvs-openxr-check = "mujoco_vive_scripts.openxr_env_check:main"
mvs-xr-pink = "mujoco_vive_scripts.xr_pink_world_check:main"
mvs-xr-mujoco-opengl = "mujoco_vive_scripts.xr_mujoco_opengl:main"
mvs-xr-crosshair = "mujoco_vive_scripts.xr_crosshair_calibration:main"
mvs-xr-comfort = "mujoco_vive_scripts.xr_mujoco_opengl_comfort:main"

[tool.setuptools.packages.find]
include = ["mujoco_vive_scripts*"]

[tool.setuptools.package-data]
mujoco_vive_scripts = ["models/*.xml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
