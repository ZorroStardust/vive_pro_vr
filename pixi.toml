[workspace]
name = "vive_pro_vr"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.13.3,<3.14"
mujoco = ">=3.12.0,<4"
numpy = ">=1.24"
pillow = ">=10.0"
pyopengl = ">=3.1.7"

[pypi-dependencies]
pyopenxr = ">=1.0.0"
glfw = ">=2.7.0"
mujoco-vive-scripts = { path = "mujoco_vive_scripts", editable = true }

[tasks]
list-monitors = { cmd = "python -m mujoco_vive_scripts.list_monitors", cwd = "mujoco_vive_scripts" }
openxr-check = { cmd = "python -m mujoco_vive_scripts.openxr_env_check", cwd = "mujoco_vive_scripts" }
save-frames = { cmd = "bash scripts/run_save_frames.sh", cwd = "mujoco_vive_scripts" }
sbs-windowed = { cmd = "bash scripts/run_sbs_windowed.sh", cwd = "mujoco_vive_scripts" }
sbs-fullscreen = { cmd = "bash scripts/run_sbs_fullscreen_monitor.sh $MONITOR", cwd = "mujoco_vive_scripts" }
start-monado = { cmd = "bash scripts/start_monado_hmd_only.sh", cwd = "mujoco_vive_scripts" }
test-openxr = { cmd = "bash scripts/test_openxr.sh", cwd = "mujoco_vive_scripts" }
install-system-deps = { cmd = "bash scripts/install_ubuntu2404.sh", cwd = "mujoco_vive_scripts" }
xr-pink-world = { cmd = "bash scripts/run_xr_pink_world.sh", cwd = "mujoco_vive_scripts" }
xr-mujoco-opengl = { cmd = "bash scripts/run_xr_mujoco_opengl.sh", cwd = "mujoco_vive_scripts" }
xr-crosshair = { cmd = "bash scripts/run_xr_crosshair.sh", cwd = "mujoco_vive_scripts" }
xr-surgical = { cmd = "bash scripts/run_xr_surgical.sh", cwd = "mujoco_vive_scripts" }
xr-mujoco-opengl-screen = { cmd = "bash scripts/run_xr_mujoco_opengl_screen.sh", cwd = "mujoco_vive_scripts" }
xr-surgical-screen = { cmd = "bash scripts/run_xr_surgical_screen.sh", cwd = "mujoco_vive_scripts" }
xr-crosshair-screen = { cmd = "bash scripts/run_xr_crosshair_screen.sh", cwd = "mujoco_vive_scripts" }
xr-pink-world-screen = { cmd = "bash scripts/run_xr_pink_world_screen.sh", cwd = "mujoco_vive_scripts" }
xr-live-video = { cmd = "python -m mujoco_vive_scripts.xr_live_video", cwd = "mujoco_vive_scripts" }
xr-live-video-screen = { cmd = "python -m mujoco_vive_scripts.xr_live_video --screen", cwd = "mujoco_vive_scripts" }
xr-live-video-testcard = { cmd = "python -m mujoco_vive_scripts.xr_live_video --test-card --screen", cwd = "mujoco_vive_scripts" }
usb-recover = { cmd = "python -m mujoco_vive_scripts.usb_recover", cwd = "mujoco_vive_scripts" }

# Detached monado-service (Plan A: setsid + /dev/null + pidfile).
# monado runs in a new session, immune to Ctrl+C.  stdin=/dev/null is
# fine for monado's init_epoll (verified after clean system reboot).
#
# Plan C2 (private Xwayland :99) was tried and abandoned — VIVE Pro
# requires KWin's DRM master which can't be shared.
# XwaylandCrashPolicy=Restart in ~/.config/kwinrc handles recovery.
#
#   pixi run monado-detached   # start; prints PID
#   pixi run monado-stop       # SIGINT -> 10s wait -> SIGTERM -> 5s wait -> SIGKILL
#   pixi run monado-status     # PID, DISPLAY, IPC, log tail
#   pixi run kde-recover       # try to restart KDE's :1 Xwayland
monado-detached = { cmd = "bash scripts/start_monado_detached.sh", cwd = "mujoco_vive_scripts" }
monado-stop     = { cmd = "bash scripts/stop_monado.sh",         cwd = "mujoco_vive_scripts" }
monado-status   = { cmd = "bash scripts/status_monado.sh",       cwd = "mujoco_vive_scripts" }
kde-recover     = { cmd = "bash scripts/kde_recover.sh",         cwd = "mujoco_vive_scripts" }
